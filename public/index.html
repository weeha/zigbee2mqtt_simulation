<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zigbee2MQTT Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 4h16l-1.2 3H9.6l9.6 10H20l-1 3H4l1.2-3h9.2L4.8 7H4z"/></svg>
      <div>
        <h1>Zigbee2MQTT Simulator</h1>
        <div class="sub" id="summary"></div>
      </div>
    </div>
    <div class="actions">
      <button class="pill" id="mqtt-status" title="MQTT connection settings"><span class="dot"></span><span id="mqtt-text">connecting…</span></button>
      <button id="btn-import" class="ghost" title="Load a home from a JSON file">Import</button>
      <button id="btn-export" class="ghost" title="Download this home (devices, rooms, scenarios) as a JSON file">Export</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <button id="btn-demo" class="ghost">Create demo home</button>
      <button id="btn-add" class="primary">+ Add device</button>
    </div>
  </header>

  <section class="clock" aria-label="Simulated clock">
    <button id="clock-play" title="Start / pause the simulated clock"></button>
    <b id="clock-time">--:--</b>
    <select id="clock-speed" title="How fast the simulated time passes"></select>
    <div class="clock-day">
      <input id="clock-slider" type="range" min="0" max="1439" step="1" aria-label="Time of day">
      <div id="clock-track" class="clock-track"></div>
    </div>
    <span id="clock-env" class="clock-env"></span>
    <button id="clock-now" class="ghost" title="Set the clock to the real time">Now</button>
    <button id="clock-settings" class="ghost" title="Sunrise, sunset and outdoor temperature">Sun &amp; weather</button>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="devices" aria-selected="true">Devices</button>
    <button role="tab" data-tab="scenarios" aria-selected="false">Scenarios</button>
    <button role="tab" data-tab="log" aria-selected="false">MQTT log</button>
  </nav>

  <main>
    <section id="tab-devices"></section>

    <section id="tab-scenarios" hidden>
      <div class="bar">
        <p class="hint">A scenario replays things happening in the house: windows opening, temperatures changing, buttons being pressed. Add "Expect" steps to check that your automations react.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
          <span id="test-summary" class="summary"></span>
          <button id="btn-tests" title="Runs every scenario that has an Expect step, one after the other" disabled>▶ Run all tests</button>
          <button id="btn-scenario" class="primary">+ New scenario</button>
        </div>
      </div>
      <div id="scenario-list"></div>
    </section>

    <section id="tab-log" hidden>
      <div class="bar">
        <input id="log-filter" type="search" placeholder="Filter by topic or payload…">
        <label class="check"><input id="log-pause" type="checkbox"> Pause</label>
        <button id="log-clear" class="ghost">Clear</button>
      </div>
      <div class="log-wrap"><table class="log"><tbody id="log-body"></tbody></table></div>
    </section>
  </main>

  <dialog id="dialog"></dialog>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
